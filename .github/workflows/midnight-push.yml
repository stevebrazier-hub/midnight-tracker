name: Midnight GPS Push

# Runs EVERY HOUR. The script checks UK time and sends whatever push
# notifications are due. With 24 runs/day, even if GitHub delays some
# by hours, the next run catches up. Firebase dedup prevents duplicates.
on:
  schedule:
    # Hourly from 9pm to 11am UK, PLUS every 15 min around the critical
    # 10pm evening window (21:30-23:15 UTC covers 10pm in both GMT & BST).
    # GitHub Actions crons are unreliable, so more attempts = more chances.
    - cron: '0 20 * * *'          # 8pm UTC (hourly)
    - cron: '0,15,30,45 21 * * *' # 9pm UTC — every 15 min (10pm BST window)
    - cron: '0,15,30,45 22 * * *' # 10pm UTC — every 15 min (10pm GMT window)
    - cron: '0,15 23 * * *'       # 11pm UTC — every 15 min first half
    - cron: '0 0-11 * * *'        # midnight–11am UTC (hourly)
  workflow_dispatch:         # manual trigger for testing
    inputs:
      capture_type:
        description: 'Capture type: midnight, evening, or morning (blank = auto-detect)'
        required: false
        default: ''

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Send push notifications (auto-detect what's due)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CAPTURE_TYPE: ${{ github.event.inputs.capture_type }}
        run: node .github/scripts/midnight-push.js
