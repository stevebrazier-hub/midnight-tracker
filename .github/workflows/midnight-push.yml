name: Midnight GPS Push

# Runs EVERY HOUR. The script checks UK time and sends whatever push
# notifications are due. With 24 runs/day, even if GitHub delays some
# by hours, the next run catches up. Firebase dedup prevents duplicates.
on:
  schedule:
    # Hourly 8pm–11am UTC. Covers all 3 UK capture times in both GMT & BST:
    #   Evening 9pm:  GMT=21:00 UTC, BST=20:00 UTC
    #   Midnight:     GMT=00:00 UTC, BST=23:00 UTC
    #   Morning 7am:  GMT=07:00 UTC, BST=06:00 UTC
    # With hourly runs, each capture gets multiple chances. Dedup prevents duplicates.
    - cron: '0 20-23 * * *'  # 8pm–11pm UTC
    - cron: '0 0-11 * * *'   # midnight–11am UTC
  workflow_dispatch:         # manual trigger for testing
    inputs:
      capture_type:
        description: 'Capture type: midnight, evening, or morning (blank = auto-detect)'
        required: false
        default: ''

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Send push notifications (auto-detect what's due)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CAPTURE_TYPE: ${{ github.event.inputs.capture_type }}
        run: node .github/scripts/midnight-push.js
