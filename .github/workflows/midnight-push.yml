name: Midnight GPS Push

# Fires at UK midnight (what matters for HMRC) + evening bracket at 10pm + morning bracket at 7am
# GMT (winter): midnight=00:00 UTC, 10pm=22:00 UTC, 7am=07:00 UTC
# BST (summer): midnight=23:00 UTC, 10pm=21:00 UTC, 7am=06:00 UTC
on:
  schedule:
    # Midnight captures (the main HMRC one)
    - cron: '0 0 * * *'    # midnight GMT (winter: late Oct - late Mar)
    - cron: '0 23 * * *'   # midnight BST (summer: late Mar - late Oct)
    # Evening bracket (10pm UK)
    - cron: '0 22 * * *'   # 10pm GMT (winter)
    - cron: '0 21 * * *'   # 10pm BST (summer)
    # Morning bracket (7am UK)
    - cron: '0 7 * * *'    # 7am GMT (winter)
    - cron: '0 6 * * *'    # 7am BST (summer)
  workflow_dispatch:         # manual trigger for testing
    inputs:
      capture_type:
        description: 'Capture type: midnight, evening, or morning'
        required: false
        default: 'midnight'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Determine capture type and check BST/GMT season
        id: capture-type
        run: |
          # Manual dispatch — always run
          if [ -n "${{ github.event.inputs.capture_type }}" ]; then
            echo "type=${{ github.event.inputs.capture_type }}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if UK is currently in BST (UTC+1) or GMT (UTC+0)
          UK_OFFSET=$(TZ=Europe/London date +%z)   # +0000 = GMT, +0100 = BST
          if [ "$UK_OFFSET" = "+0100" ]; then
            IS_BST=true
          else
            IS_BST=false
          fi
          echo "UK offset: $UK_OFFSET (BST=$IS_BST)"

          # Map cron → capture type + expected season
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "0 0 * * *")   TYPE=midnight; EXPECTS_BST=false ;;
            "0 23 * * *")  TYPE=midnight; EXPECTS_BST=true  ;;
            "0 22 * * *")  TYPE=evening;  EXPECTS_BST=false ;;
            "0 21 * * *")  TYPE=evening;  EXPECTS_BST=true  ;;
            "0 7 * * *")   TYPE=morning;  EXPECTS_BST=false ;;
            "0 6 * * *")   TYPE=morning;  EXPECTS_BST=true  ;;
            *)              TYPE=midnight; EXPECTS_BST=false ;;
          esac

          echo "type=$TYPE" >> $GITHUB_OUTPUT

          # Skip if this cron is for the wrong season
          if [ "$EXPECTS_BST" = "true" ] && [ "$IS_BST" = "false" ]; then
            echo "Skipping: BST cron fired but UK is in GMT"
            echo "skip=true" >> $GITHUB_OUTPUT
          elif [ "$EXPECTS_BST" = "false" ] && [ "$IS_BST" = "true" ]; then
            echo "Skipping: GMT cron fired but UK is in BST"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Correct season — proceeding with $TYPE capture"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Send push notification (${{ steps.capture-type.outputs.type }})
        if: steps.capture-type.outputs.skip != 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CAPTURE_TYPE: ${{ steps.capture-type.outputs.type }}
        run: node .github/scripts/midnight-push.js
