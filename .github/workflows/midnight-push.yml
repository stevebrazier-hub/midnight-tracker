name: Midnight GPS Push

# Fires at UK midnight (what matters for HMRC) + bracket captures at 10pm and 7am
# GMT (winter): midnight UK = 00:00 UTC, 10pm = 22:00 UTC, 7am = 07:00 UTC
# BST (summer): midnight UK = 23:00 UTC, 10pm = 21:00 UTC, 7am = 06:00 UTC
on:
  schedule:
    # Midnight captures (the main HMRC one)
    - cron: '0 0 * * *'    # midnight GMT (winter: late Oct - late Mar)
    - cron: '0 23 * * *'   # midnight BST (summer: late Mar - late Oct)
    # Evening bracket (10pm UK)
    - cron: '0 22 * * *'   # 10pm GMT (winter)
    - cron: '0 21 * * *'   # 10pm BST (summer)
    # Morning bracket (7am UK)
    - cron: '0 7 * * *'    # 7am GMT (winter)
    - cron: '0 6 * * *'    # 7am BST (summer)
  workflow_dispatch:         # manual trigger for testing
    inputs:
      capture_type:
        description: 'Capture type: midnight, evening, or morning'
        required: false
        default: 'midnight'

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Determine capture type from schedule
        id: capture-type
        run: |
          # Manual dispatch uses the input
          if [ -n "${{ github.event.inputs.capture_type }}" ]; then
            echo "type=${{ github.event.inputs.capture_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Determine from cron schedule (CRON field in github.event.schedule)
          CRON="${{ github.event.schedule }}"
          case "$CRON" in
            "0 0 * * *"|"0 23 * * *")  echo "type=midnight" >> $GITHUB_OUTPUT ;;
            "0 22 * * *"|"0 21 * * *") echo "type=evening" >> $GITHUB_OUTPUT ;;
            "0 7 * * *"|"0 6 * * *")   echo "type=morning" >> $GITHUB_OUTPUT ;;
            *)                          echo "type=midnight" >> $GITHUB_OUTPUT ;;
          esac

      - name: Send push notification (${{ steps.capture-type.outputs.type }})
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CAPTURE_TYPE: ${{ steps.capture-type.outputs.type }}
        run: node .github/scripts/midnight-push.js
