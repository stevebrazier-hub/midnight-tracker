name: Midnight GPS Push

# Fires at UK midnight (what matters for HMRC)
# GMT (winter): midnight UK = 00:00 UTC
# BST (summer): midnight UK = 23:00 UTC
on:
  schedule:
    - cron: '0 0 * * *'    # midnight GMT (winter: late Oct - late Mar)
    - cron: '0 23 * * *'   # midnight BST (summer: late Mar - late Oct)
  workflow_dispatch:         # manual trigger for testing

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12

      - name: Send midnight push notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/midnight-push.js
