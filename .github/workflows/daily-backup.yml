name: Daily Firebase backup

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily (after midnight CET)
  workflow_dispatch:         # manual trigger

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin@12 xlsx@0.18

      - name: Run backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/daily-backup.js

      - name: Upload to OneDrive
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
        run: node .github/scripts/onedrive-upload.js

      - name: Save backup files
        run: cp -r backups/ /tmp/backups-staging

      - name: Re-checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Commit backup files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p backups/history
          cp -f /tmp/backups-staging/*.json backups/
          cp -f /tmp/backups-staging/*.xlsx backups/
          cp -f /tmp/backups-staging/history/*.json backups/history/
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Daily backup $(date -u +%Y-%m-%d)"
          # Retry push up to 3 times (in case of race with other pushes)
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi
            echo "Push failed (attempt $i), fetching latest and retrying..."
            git fetch origin main
            git rebase origin/main --strategy-option=theirs || true
            git add backups/
            git diff --staged --quiet || git commit --amend --no-edit
          done
          echo "ERROR: Push failed after 3 attempts"
          exit 1
